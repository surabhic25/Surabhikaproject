<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management dcvuwhbei System - V2</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        input, select {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 9px 12px;
            margin: 3px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .add-btn {
            background-color: #27ae60;
        }

        .issue-btn {
            background-color: #3498db;
        }

        .delete-btn {
            background-color: #e74c3c;
        }

        .stats {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }

        .card {
            flex: 1;
            padding: 15px;
            text-align: center;
            background: #dce8f5;
            border-radius: 8px;
        }

        .card h3 {
            margin: 5px;
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        .available {
            color: green;
            font-weight: bold;
        }

        .issued {
            color: red;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .stats {
                flex-direction: column;
            }

            .container {
                padding: 12px;
                overflow-x: auto;
            }

            table {
                min-width: 650px;
            }
        }
    </style>
</head>

<body>

    <h1>Library Management System</h1>
    <p style="text-align:center;">Version 2.0</p>

    <div class="container">

        <div class="stats">
            <div class="card">
                <h3 id="totalBooks">0</h3>
                <p>Total Books</p>
            </div>

            <div class="card">
                <h3 id="availableBooks">0</h3>
                <p>Available Books</p>
            </div>

            <div class="card">
                <h3 id="issuedBooks">0</h3>
                <p>Issued Books</p>
            </div>
        </div>

        <h2>Add a New Book</h2>

        <input type="text" id="bookName" placeholder="Enter book name">
        <input type="text" id="authorName" placeholder="Enter author name">
        <input type="text" id="category" placeholder="Enter book category">

        <button class="add-btn" onclick="addBook()">Add Book</button>

        <h2>Search Books</h2>

        <input type="text" id="search"
               placeholder="Search by ID, name, author or category"
               oninput="displayBooks()">

        <h2>Book Inventory</h2>

        <table>
            <thead>
                <tr>
                    <th>Book ID</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="bookList"></tbody>
        </table>

    </div>

    <script>
        let nextId = 4;

        let books = [
            {
                id: 1,
                name: "Java Programming",
                author: "James Gosling",
                category: "Programming",
                issued: false
            },
            {
                id: 2,
                name: "Python Basics",
                author: "Guido van Rossum",
                category: "Programming",
                issued: false
            },
            {
                id: 3,
                name: "Database Systems",
                author: "Raghu Ramakrishnan",
                category: "Database",
                issued: true
            }
        ];

        function addBook() {
            const name = document.getElementById("bookName").value.trim();
            const author = document.getElementById("authorName").value.trim();
            const category = document.getElementById("category").value.trim();

            if (!name || !author || !category) {
                alert("Please fill in all fields!");
                return;
            }

            books.push({
                id: nextId++,
                name: name,
                author: author,
                category: category,
                issued: false
            });

            document.getElementById("bookName").value = "";
            document.getElementById("authorName").value = "";
            document.getElementById("category").value = "";

            displayBooks();
            alert("Book added successfully!");
        }

        function toggleBook(index) {
            books[index].issued = !books[index].issued;
            displayBooks();
        }

        function deleteBook(index) {
            if (confirm("Are you sure you want to delete this book?")) {
                books.splice(index, 1);
                displayBooks();
            }
        }

        function displayBooks() {
            const list = document.getElementById("bookList");
            const search = document.getElementById("search").value.toLowerCase();

            list.innerHTML = "";

            const filteredBooks = books.filter(book =>
                String(book.id).includes(search) ||
                book.name.toLowerCase().includes(search) ||
                book.author.toLowerCase().includes(search) ||
                book.category.toLowerCase().includes(search)
            );

            filteredBooks.forEach(book => {
                const index = books.indexOf(book);
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${book.id}</td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td class="${book.issued ? 'issued' : 'available'}">
                        ${book.issued ? 'Issued' : 'Available'}
                    </td>
                    <td></td>
                `;

                // Use textContent to display user-entered text safely.
                row.cells[1].textContent = book.name;
                row.cells[2].textContent = book.author;
                row.cells[3].textContent = book.category;

                const issueButton = document.createElement("button");
                issueButton.className = "issue-btn";
                issueButton.textContent = book.issued ? "Return" : "Issue";
                issueButton.onclick = () => toggleBook(index);

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "Delete";
                deleteButton.onclick = () => deleteBook(index);

                row.cells[5].append(issueButton, deleteButton);
                list.appendChild(row);
            });

            document.getElementById("totalBooks").textContent = books.length;
            document.getElementById("availableBooks").textContent =
                books.filter(book => !book.issued).length;
            document.getElementById("issuedBooks").textContent =
                books.filter(book => book.issued).length;
        }

        displayBooks();
    </script>

</body>
</html>
